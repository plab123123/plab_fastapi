[tool.poetry]
name = "plab-fastapi"
version = "0.1.0"
description = ""
authors = ["choijian <an032944@daum.net>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
ruff = "^0.12.5"
uvicorn = "^0.35.0"
pydantic = "^2.11.7"
requests = "^2.32.4"
python-dotenv = "^1.1.1"
langchain-mcp-adapters = "^0.1.9"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 88  # 최대 줄 길이
target-version = "py312"  # 타겟 파이썬 버전

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "ANN"] # 적용할 린트 규칙
ignore = ["ANN204"]

[tool.ruff.format]
quote-style = "double"  # 문자열 따옴표 스타일